name: Daily Finance Report Email

on:
  schedule:
    # 12:30 UTC == 18:00 IST (6:00 PM IST) every day
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Optional override date (YYYY-MM-DD in IST)'
        required: false
        default: ''

jobs:
  send-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install python-dotenv pymongo dnspython

      - name: Generate and send daily finance report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ATTACH_CSV: 'true'
        run: |
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            python daily_report.py --date "${{ github.event.inputs.report_date }}"
          else
            python daily_report.py
          fi
