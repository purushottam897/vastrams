name: Weekly Business Report Email

on:
  schedule:
    # Every Sunday at 13:00 UTC == 18:30 IST (6:30 PM IST)
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional start date override (YYYY-MM-DD in IST)'
        required: false
        default: ''
      end_date:
        description: 'Optional end date override (YYYY-MM-DD in IST)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (generate report without emailing)'
        required: false
        type: boolean
        default: false

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pymongo dnspython

      - name: Generate and Send Weekly Business Report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          CMD="python weekly_report.py"
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            CMD="$CMD --start-date ${{ github.event.inputs.start_date }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            CMD="$CMD --end-date ${{ github.event.inputs.end_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          eval $CMD
